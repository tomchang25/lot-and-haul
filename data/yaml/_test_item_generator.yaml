affix_combinations:
  - combination_id: test_comb
    affix_id: test_affix
    weight: 1
    surface_clue_ids:
      - test_surface_easy
      - test_surface_hard
    hidden_clue_ids: []
  - combination_id: test_comb_prefix_2
    affix_id: test_affix_prefix_2
    weight: 1
    surface_clue_ids:
      - test_surface_extra
    hidden_clue_ids:
      - test_hidden_extra
  - combination_id: test_comb_suffix_01
    affix_id: test_affix_suffix
    weight: 2
    surface_clue_ids:
      - test_surface_suffix
    hidden_clue_ids:
      - test_hidden_suffix
  - combination_id: test_comb_suffix_02
    affix_id: test_affix_suffix
    weight: 1
    surface_clue_ids:
      - test_surface_easy
    hidden_clue_ids:
      - test_hidden_override

affixes:
  - affix_id: test_affix
    naming_slot: prefix
    display_name_key: AFFIX_TEST_AFFIX
    scope_mode: categories
    category_scope:
      - test_category
    weight: 1
    combination_ids:
      - test_comb
  - affix_id: test_affix_prefix_2
    naming_slot: prefix
    display_name_key: AFFIX_TEST_AFFIX_2
    scope_mode: categories
    category_scope:
      - test_category
    weight: 1
    combination_ids:
      - test_comb_prefix_2
  - affix_id: test_affix_suffix
    naming_slot: suffix
    display_name_key: AFFIX_TEST_SUFFIX
    scope_mode: categories
    category_scope:
      - test_category
    weight: 1
    combination_ids:
      - test_comb_suffix_01
      - test_comb_suffix_02

cars:
  - car_id: test_car
    display_name: Test Car
    is_test: true
    grid_columns: 4
    grid_rows: 3
    max_weight: 500.0
    stamina_cap: 30
    fuel_cost_per_day: 10
    extra_slot_count: 0
    price: 0

lots:
  - lot_id: test_lot
    is_test: true
    tier_weights: { 1: 100 }
    rarity_weights: { 0: 100 }
    category_weights: { test_category: 1 }
    super_category_weights: {}
  - lot_id: test_lot_rare
    is_test: true
    tier_weights: { 1: 100 }
    rarity_weights: { 2: 100 }
    category_weights: { test_category: 1 }
    super_category_weights: {}
  - lot_id: test_lot_legendary
    is_test: true
    tier_weights: { 1: 100 }
    rarity_weights: { 4: 100 }
    category_weights: { test_category: 1 }
    super_category_weights: {}
  - lot_id: test_lot_mixed
    is_test: true
    tier_weights: { 1: 100 }
    rarity_weights: { 0: 30, 2: 60, 4: 10 }
    category_weights: { test_category: 1 }
    super_category_weights: {}

locations:
  - location_id: test_location
    is_test: true
    display_name_key: LOC_TEST_LOCATION
    description_key: LOC_TEST_LOCATION_DESC
    entry_fee: 50
    travel_days: 2
    lot_number: 1
    transition_type: sliding_door
