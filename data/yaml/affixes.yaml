# Playtest affixes and affix combinations.
# Combinations are separate entries keyed to their parent affix via affix_id.
# Clue ids reference entries in data/yaml/clues.yaml and must pass the
# cross-product conflict validator at build time.

affix_combinations:
  # ── Handbag: Rustic (prefix) ──────────────────────────────────────────
  - combination_id: comb_bag_rustic_01
    affix_id: bag_rustic
    weight: 3
    surface_clue_ids:
      - bag_exterior_faded
      - bag_hardware_tarnished
    hidden_clue_ids:
      - bag_leaf_coach

  - combination_id: comb_bag_rustic_02
    affix_id: bag_rustic
    weight: 1
    surface_clue_ids:
      - bag_exterior_synthetic
      - bag_hardware_tarnished
    hidden_clue_ids:
