# reference_tables.yaml
#
# Per-category balancing TARGETS for generated clue/item content. Tooling-only:
# this file is NOT converted to .tres and is ignored by validate_yaml.py and yaml_to_tres.py.
# yaml_stats.py reads it and emits an out-of-band WARNING when a category's realized
# statistic falls outside its band. Bands are balance signals, never hard errors.
#
# Stat == 'full true value' per item (all clues applied, reveal-state ignored), per
# common/gameplay/instance/item_entry.gd full_true_value():
#   base = override.effect_amount if any hidden override else anchor.base_value  (first override wins)
#   value = (base + Sum_all_add) * Prod_all_mul     # add/mul over BOTH surface and hidden clues
# Condition multiplier (0.25x..4.0x) is applied at price time and is NOT included here;
# the condition: block records the expected as-acquired multiplier band per category.
#
# Comparison semantics (implemented by yaml_stats.py against the real schema — see regen plan):
#   - resolve anchor_id -> anchors[].base_value; surface_ids/hidden_ids -> clues[].effect_op/effect_amount
#   - band violation  -> [WARN] (balance signal)
#   - schema violation -> validate_yaml.py error (separate tool, hard failure)
#
# Bands derived by Monte Carlo (60k samples/category) over the adopted tiered effect
# budgets + super-category personalities; trimmed to p05-p95 to exclude jackpot/collapse tails.
# Regenerate: dev/tools/prompts/yaml_generation snapshot — bands are targets, round numbers expected.

reference_tables:
  - category_id: handbag
    super_category: fashion            # Handbag
    median: { min: 350, max: 1100 }
    mean:   { min: 550, max: 1900 }
    stddev: { min: 550, max: 2400 }
    min:    { min: 5, max: 350 }
    max:    { min: 900, max: 21000 }
    condition:                        # expected as-acquired condition multiplier (documentation-only)
      expected_multiplier: { min: 0.63, max: 1.74 }
      mean_multiplier: 1.17

