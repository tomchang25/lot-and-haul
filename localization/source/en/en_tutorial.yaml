en:
  TUT_HUB_BODY: "This shows the current day and your available time slots. You have two slots per day: Day and Night. Each slot can be used for one activity. Click the Activity button to choose."
  TUT_HUB_CHOOSER_BODY: "From here you can start an Auction run, manage items in Storage, open your Shop to sell to nightly customers, upgrade your Vehicle, or study Knowledge to improve your attributes."
  TUT_HUB_STORAGE_NAVIGATE_BODY: "Let's visit the Workshop to see what you've collected. Click the Storage button to continue."
  TUT_ONBOARDING_INTRO_TITLE: "Welcome to Lot & Haul!\n\nThis is your Hub. Each day has two time slots: Day and Night. You can use each slot for one activity. Let's start your first day with an Auction Run."
  TUT_HUB_ACTIVITY_CHOOSER_HINT: "Click the Activity button to open the activity chooser."
  TUT_HUB_CHOOSE_AUCTION_HINT: "Choose Auction to begin your first run."
  TUT_STORAGE_CHOOSE_BODY: "Good run! Now let's visit Storage.\n\nYou can manage items, repair them, and research hidden details."
  TUT_HUB_CHOOSER_HINT: "Click the Activity button to open the chooser."
  TUT_HUB_CHOOSE_STORAGE_HINT: "Choose Storage to manage your items."
  TUT_WORKSHOP_INTRO_BODY: "Welcome to the Workshop! This is where you prepare items for sale. You can Repair, Restore, and Research items using Action Points (AP)."
  TUT_WORKSHOP_ITEM_BROWSER_HINT: "This table lists every item in storage. Columns show the item name, condition (damage level), estimated value, and rarity. Click any row to inspect it in detail."
  TUT_WORKSHOP_DETAIL_RAIL_HINT: "Select an item to see its details here: name, category, rarity, condition, estimated value, and price convergence. The closer convergence is to 100%, the more accurate the estimate."
  TUT_WORKSHOP_REPAIR_HINT: "Repair improves condition up to 50%, and Restore pushes it from 50% to 100%. Only one button appears based on the current state. Better condition means higher sale prices. Improve this item's condition, then continue."
  TUT_WORKSHOP_RESEARCH_HINT: "Research reveals hidden details about an item. Each discovery can dramatically change the item's value — for better or worse. Try researching this item, then continue."
  TUT_WORKSHOP_APPRAISED_VS_VERIFIED_BODY: "Appraised vs. Verified Value: The items you collect have surface clues that give an estimated value range. Research uncovers hidden clues, revealing the true verified value which may be far higher — or lower — than the estimate."
  TUT_WORKSHOP_AP_HINT: "AP (Action Points) fuel all workshop actions. Each Repair, Restore, or Research action costs AP. Your AP pool refills each time you visit the Workshop in a new slot."
  TUT_WORKSHOP_LEAVE_HINT: "When you're done, click here to return to the Hub and continue your day. You can always come back to the Workshop later."
  TUT_DAY_PASS_HINT: "Day 1 is complete! Review your net profit, then click Continue to move to Day 2."
  TUT_SHOP_CHOOSE_BODY: "Welcome to Day 2! Let's try selling to nightly customers."
  TUT_HUB_CHOOSE_SELL_HINT: "Choose Selling to open your shop."
  TUT_SELLING_INTRO_BODY: "Welcome to your shop! Let's walk through serving your first customer step by step."
  TUT_SELLING_CUSTOMER_QUEUE_HINT: "This is your customer queue. Each tab shows a customer and their demand tags — the kinds of items they're looking for. Click a tab to select a customer."
  TUT_SELLING_ITEM_LIST_HINT: "These are your item cards. The top number is the price, the badge shows rarity, and the coloured bar indicates condition. Tags at the bottom show which categories this item matches."
  TUT_SELLING_CAR_PANEL_HINT: "Pick up an item from the list and drop it into the car grid on the right. Items must fit the customer's car shape and match their demand tags to count toward the sale."
  TUT_SELLING_CONSERVATIVE_HINT: "Conservative selling gives a safe ×1.2 multiplier on the total item value. It guarantees the sale — no risk, no dice. Handy when you want a sure deal."
  TUT_SELLING_AGGRESSIVE_HINT: "Aggressive selling rolls dice to multiply the total item value. The better your item fit (depth) and the more verified items you have, the more dice you roll. Try it — press the Aggressive button."
  TUT_SELLING_DICE_HINT: "The dice show your luck: each die can add to or subtract from the multiplier."
  TUT_SELLING_RESULT_HINT: "Green faces are good, red faces are bad. The result sets your final price. Press Confirm when ready. Review the receipt, then confirm to complete the sale."
  TUT_SELLING_COMPLETE_HINT: "Great! You can serve more customers or click Back to return to the Hub and finish the day."
  TUT_COMPLETE_BODY: "Congratulations! You've completed the Lot & Haul tutorial.\n\nYou know how to run auctions, manage storage, and sell to customers. The rest is up to you — good luck out there!"
  TUT_LOCATION_SELECT_HINT: "Pick a location to visit. Each location has different lots and travel costs."
  TUT_LOT_BROWSE_HINT: "Browse the available lots and choose one to inspect."
  TUT_INSPECTION_ITEM_SELECT_HINT: "Select the item card to inspect it."
  TUT_INSPECTION_UNVEIL_HINT: "Unveil the item to reveal its identity."
  TUT_INSPECTION_INSPECT_HINT: "Inspect the unveiled item to reveal clue details."
  TUT_INSPECTION_REVIEW_HINT: "Review the lot before starting the auction."
  TUT_INSPECTION_START_AUCTION_HINT: "Start the auction when you're ready."
  TUT_AUCTION_BID_HINT: "Click Bid to place your first bid. No rivals will bid in this tutorial auction."
  TUT_AUCTION_WAIT_BODY: "With no rival bids, wait for the auction to close."
  TUT_REVEAL_HINT: "Reveal what you won before loading cargo."
  TUT_REVEAL_CONTINUE_HINT: "Continue back to the lot list, then head to cargo loading."
  TUT_CARGO_SELECT_HINT: "Select the item you want to load."
  TUT_CARGO_PLACE_HINT: "Place the item into your cargo grid."
  TUT_CARGO_CONTINUE_HINT: "Click Continue when your cargo is ready."
  TUT_RUN_REVIEW_HINT: "Review your run results and continue to the Hub."
