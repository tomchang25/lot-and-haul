zh_TW:
  TUT_HUB_BODY: "顯示目前日期和可用時間槽。每天有兩個時間槽：白天和夜晚。每個時間槽可用於一個活動。點擊活動按鈕進行選擇。"
  TUT_HUB_CHOOSER_BODY: "在這裡你可以開始拍賣運行、管理儲存中的物品、打開商店向夜間顧客銷售、升級你的車輛，或學習知識以提升你的屬性。"
  TUT_HUB_STORAGE_NAVIGATE_BODY: "讓我們去工作坊看看你收集了什麼。點擊儲存按鈕繼續。"
  TUT_ONBOARDING_INTRO_TITLE: "歡迎來到 Lot & Haul！\n\n這是你的樞紐。每天有兩個時間槽：白天和夜晚。每個時間槽可用於一個活動。讓我們從拍賣運行開始你的第一天。"
  TUT_HUB_ACTIVITY_CHOOSER_HINT: "點擊活動按鈕開啟活動選擇器。"
  TUT_HUB_CHOOSE_AUCTION_HINT: "選擇拍賣開始你的第一次運行。"
  TUT_STORAGE_CHOOSE_BODY: "運行順利！現在讓我們訪問儲存。\n\n你可以管理物品、修理它們，以及研究隱藏的細節。"
  TUT_HUB_CHOOSER_HINT: "點擊活動按鈕開啟選擇器。"
  TUT_HUB_CHOOSE_STORAGE_HINT: "選擇儲存來管理你的物品。"
  TUT_WORKSHOP_INTRO_BODY: "歡迎來到工作坊！這是你為銷售準備物品的地方。你可以使用行動點（AP）來修理、修復和研究物品。"
  TUT_WORKSHOP_ITEM_BROWSER_HINT: "此表格列出了儲存中的所有物品。欄位顯示物品名稱、狀況（損壞程度）、估計價值和稀有度。點擊任意行以詳細檢視。"
  TUT_WORKSHOP_DETAIL_RAIL_HINT: "選擇一個物品在此檢視其詳細資訊：名稱、類別、稀有度、狀況、估計價值和價格收斂度。收斂度越接近100%，估計越準確。"
  TUT_WORKSHOP_REPAIR_HINT: "修理可將狀況提升至50%，修復可將其從50%提升至100%。根據目前狀態只顯示一個按鈕。更好的狀況意味著更高的銷售價格。改善此物品的狀況，然後繼續。"
  TUT_WORKSHOP_RESEARCH_HINT: "研究揭示物品的隱藏細節。每次發現都可能極大地改變物品的價值——無論是好是壞。嘗試研究此物品，然後繼續。"
  TUT_WORKSHOP_APPRAISED_VS_VERIFIED_BODY: "估價與驗證價值：你收集的物品有表面線索提供估計價值範圍。研究揭示隱藏線索，顯示真實的驗證價值，可能遠高於或低於估計值。"
  TUT_WORKSHOP_AP_HINT: "AP（行動點）為所有工作坊操作提供動力。每次修理、修復或研究行動都需要AP。每次在新時間槽訪問工作坊時，你的AP池都會補充。"
  TUT_WORKSHOP_LEAVE_HINT: "完成後，點擊此處返回樞紐繼續你的一天。你可以隨時回到工作坊。"
  TUT_DAY_PASS_HINT: "第1天完成！檢視你的淨利潤，然後點擊繼續進入第2天。"
  TUT_SHOP_CHOOSE_BODY: "歡迎來到第2天！讓我們嘗試向夜間顧客銷售。"
  TUT_HUB_CHOOSE_SELL_HINT: "選擇銷售來打開你的商店。"
  TUT_SELLING_INTRO_BODY: "歡迎來到你的商店！讓我們逐步了解如何服務你的第一位顧客。"
  TUT_SELLING_CUSTOMER_QUEUE_HINT: "這是你的顧客佇列。每個標籤顯示一位顧客及其需求標籤——他們正在尋找的物品類型。點擊標籤選擇一位顧客。"
  TUT_SELLING_ITEM_LIST_HINT: "這些是物品卡。頂部的數字是價格，徽章顯示稀有度，彩色條表示狀況。底部的標籤顯示此物品匹配的類別。"
  TUT_SELLING_CAR_PANEL_HINT: "從清單中拿起一個物品，放入右側的車輛網格中。物品必須適合顧客的車輛形狀並匹配其需求標籤才能計入銷售。"
  TUT_SELLING_CONSERVATIVE_HINT: "保守銷售提供安全的×1.2倍物品總價值乘數。它保證銷售——無風險，無骰子。當你想要確定交易時很方便。"
  TUT_SELLING_AGGRESSIVE_HINT: "激進銷售擲骰子乘以物品總價值。你的物品適配度（深度）越好，驗證物品越多，你擲的骰子就越多。試試看——按下激進按鈕。"
  TUT_SELLING_DICE_HINT: "骰子顯示你的運氣：每個骰子可以增加或減少乘數。"
  TUT_SELLING_RESULT_HINT: "綠色面為好，紅色面為差。結果設定你的最終價格。準備就緒後按確認。檢視收據，然後確認完成銷售。"
  TUT_SELLING_COMPLETE_HINT: "太棒了！你可以服務更多顧客或點擊返回回到樞紐並結束當天。"
  TUT_COMPLETE_BODY: "恭喜！你已經完成了 Lot & Haul 教學。\n\n你知道如何運行拍賣、管理儲存和向顧客銷售。剩下的就看你的了——祝你好運！"
  TUT_LOCATION_SELECT_HINT: "選擇一個地點訪問。每個地點有不同的拍品和旅行費用。"
  TUT_LOT_BROWSE_HINT: "瀏覽可用的拍品並選擇一個進行檢查。"
  TUT_INSPECTION_ITEM_SELECT_HINT: "選擇物品卡片進行檢查。"
  TUT_INSPECTION_UNVEIL_HINT: "揭曉物品以顯示其身份。"
  TUT_INSPECTION_INSPECT_HINT: "檢查已揭曉的物品以顯示線索詳情。"
  TUT_INSPECTION_REVIEW_HINT: "在開始拍賣前審查拍品。"
  TUT_INSPECTION_START_AUCTION_HINT: "準備好後開始拍賣。"
  TUT_AUCTION_BID_HINT: "點擊出價來放置你的第一個出價。本次教學拍賣中沒有競爭對手出價。"
  TUT_AUCTION_WAIT_BODY: "沒有競爭對手出價，等待拍賣結束。"
  TUT_REVEAL_HINT: "在裝載貨物前揭示你贏得的物品。"
  TUT_REVEAL_CONTINUE_HINT: "繼續返回拍品清單，然後前往貨物裝載。"
  TUT_CARGO_SELECT_HINT: "選擇你想要裝載的物品。"
  TUT_CARGO_PLACE_HINT: "將物品放入你的貨物網格中。"
  TUT_CARGO_CONTINUE_HINT: "貨物準備好後點擊繼續。"
  TUT_RUN_REVIEW_HINT: "檢視你的運行結果並繼續到樞紐。"
