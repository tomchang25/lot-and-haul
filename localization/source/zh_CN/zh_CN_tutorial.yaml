zh_CN:
  TUT_HUB_BODY: "显示当前日期和可用时间槽。每天有两个时间槽：白天和夜晚。每个时间槽可用于一个活动。点击活动按钮进行选择。"
  TUT_HUB_CHOOSER_BODY: "在这里你可以开始拍卖运行、管理存储中的物品、打开商店向夜间顾客销售、升级你的车辆，或学习知识以提升你的属性。"
  TUT_HUB_STORAGE_NAVIGATE_BODY: "让我们去工作坊看看你收集了什么。点击存储按钮继续。"
  TUT_ONBOARDING_INTRO_TITLE: "欢迎来到 Lot & Haul！\n\n这是你的枢纽。每天有两个时间槽：白天和夜晚。每个时间槽可用于一个活动。让我们从拍卖运行开始你的第一天。"
  TUT_HUB_ACTIVITY_CHOOSER_HINT: "点击活动按钮打开活动选择器。"
  TUT_HUB_CHOOSE_AUCTION_HINT: "选择拍卖开始你的第一次运行。"
  TUT_STORAGE_CHOOSE_BODY: "运行顺利！现在让我们访问存储。\n\n你可以管理物品、修理它们，以及研究隐藏的细节。"
  TUT_HUB_CHOOSER_HINT: "点击活动按钮打开选择器。"
  TUT_HUB_CHOOSE_STORAGE_HINT: "选择存储来管理你的物品。"
  TUT_WORKSHOP_INTRO_BODY: "欢迎来到工作坊！这是你为销售准备物品的地方。你可以使用行动点（AP）来修理、修复和研究物品。"
  TUT_WORKSHOP_ITEM_BROWSER_HINT: "此表格列出了存储中的所有物品。列显示物品名称、状况（损坏程度）、估计价值和稀有度。点击任意行以详细查看。"
  TUT_WORKSHOP_DETAIL_RAIL_HINT: "选择一个物品，在此查看其详细信息：名称、类别、稀有度、状况、估计价值和价格收敛度。收敛度越接近100%，估计越准确。"
  TUT_WORKSHOP_REPAIR_HINT: "修理可将状况提升至50%，修复可将其从50%提升至100%。根据当前状态只显示一个按钮。更好的状况意味着更高的销售价格。改善此物品的状况，然后继续。"
  TUT_WORKSHOP_RESEARCH_HINT: "研究揭示物品的隐藏细节。每次发现都可能极大地改变物品的价值——无论是好是坏。尝试研究此物品，然后继续。"
  TUT_WORKSHOP_APPRAISED_VS_VERIFIED_BODY: "估价与验证价值：你收集的物品有表面线索提供估计价值范围。研究揭示隐藏线索，显示真实的验证价值，可能远高于或低于估计值。"
  TUT_WORKSHOP_AP_HINT: "AP（行动点）为所有工作坊操作提供动力。每次修理、修复或研究行动都需要AP。每次在新时间槽访问工作坊时，你的AP值都会补充。"
  TUT_WORKSHOP_LEAVE_HINT: "完成后，点击此处返回枢纽继续你的一天。你可以随时回到工作坊。"
  TUT_DAY_PASS_HINT: "第1天完成！查看你的净利润，然后点击继续进入第2天。"
  TUT_SHOP_CHOOSE_BODY: "欢迎来到第2天！让我们尝试向夜间顾客销售。"
  TUT_HUB_CHOOSE_SELL_HINT: "选择销售来打开你的商店。"
  TUT_SELLING_INTRO_BODY: "欢迎来到你的商店！让我们逐步了解如何服务你的第一位顾客。"
  TUT_SELLING_CUSTOMER_QUEUE_HINT: "这是你的顾客队列。每个标签页显示一位顾客及其需求标签——他们正在寻找的物品类型。点击标签页选择一位顾客。"
  TUT_SELLING_ITEM_LIST_HINT: "这些是物品卡。顶部的数字是价格，徽章显示稀有度，彩色条表示状况。底部的标签显示此物品匹配的类别。"
  TUT_SELLING_CAR_PANEL_HINT: "从列表中拿起一个物品，放入右侧的车辆网格中。物品必须适合顾客的车辆形状并匹配其需求标签才能计入销售。"
  TUT_SELLING_CONSERVATIVE_HINT: "保守销售提供安全的×1.2倍物品总价值乘数。它保证销售——无风险，无骰子。当你想要确定交易时很方便。"
  TUT_SELLING_AGGRESSIVE_HINT: "激进销售掷骰子乘以物品总价值。你的物品贴合度（深度）越好，验证物品越多，你掷的骰子就越多。试试看——按下激进按钮。"
  TUT_SELLING_DICE_HINT: "骰子显示你的运气：每个骰子可以增加或减少乘数。"
  TUT_SELLING_RESULT_HINT: "绿色面为好，红色面为差。结果设定你的最终价格。准备就绪后按确认。查看收据，然后确认完成销售。"
  TUT_SELLING_COMPLETE_HINT: "太棒了！你可以服务更多顾客或点击返回回到枢纽并结束当天。"
  TUT_COMPLETE_BODY: "恭喜！你已经完成了 Lot & Haul 教程。\n\n你知道如何运行拍卖、管理存储和向顾客销售。剩下的就看你的了——祝你好运！"
  TUT_LOCATION_SELECT_HINT: "选择一个地点访问。每个地点有不同的拍品和旅行费用。"
  TUT_LOT_BROWSE_HINT: "浏览可用的拍品并选择一个进行检查。"
  TUT_INSPECTION_ITEM_SELECT_HINT: "选择物品卡片进行检查。"
  TUT_INSPECTION_UNVEIL_HINT: "揭开物品以显示其身份。"
  TUT_INSPECTION_INSPECT_HINT: "检查已揭开的物品以显示线索详情。"
  TUT_INSPECTION_REVIEW_HINT: "在开始拍卖前审查拍品。"
  TUT_INSPECTION_START_AUCTION_HINT: "准备好后开始拍卖。"
  TUT_AUCTION_BID_HINT: "点击出价来放置你的第一个出价。本次教程拍卖中没有竞争对手出价。"
  TUT_AUCTION_WAIT_BODY: "没有竞争对手出价，等待拍卖结束。"
  TUT_REVEAL_HINT: "在装载货物前揭示你赢得的物品。"
  TUT_REVEAL_CONTINUE_HINT: "继续返回拍品列表，然后前往货物装载。"
  TUT_CARGO_SELECT_HINT: "选择你想要装载的物品。"
  TUT_CARGO_PLACE_HINT: "将物品放入你的货物网格中。"
  TUT_CARGO_CONTINUE_HINT: "货物准备好后点击继续。"
  TUT_RUN_REVIEW_HINT: "查看你的运行结果并继续到枢纽。"
